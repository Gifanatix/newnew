name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS staging URL to scan with OWASP ZAP
        required: true
        type: string

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
